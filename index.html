<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zihin Adası - 3D Gelişmiş Diorama</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #090c10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    
    /* Modern Glassmorphic HUD */
    #hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      color: #fff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }
    .info-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 130px;
    }
    .streak-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      font-weight: 600;
    }
    .streak-val {
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stage-badge {
      font-size: 11px;
      color: #a7f3d0;
      font-weight: 500;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:hover {
      background: #334155;
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
    }
    button.primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
    }
    button.primary:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }
    button.danger {
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    button.danger:hover {
      background: #dc2626;
      color: white;
    }
    input[type="number"] {
      width: 65px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: #38bdf8;
    }
    #storm-banner {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(220, 38, 38, 0.85);
      backdrop-filter: blur(8px);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: none;
      animation: pulse 2s infinite;
      box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4);
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.5; }
    }
  </style>
  <!-- Three.js ve OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="storm-banner">⛈️ Fırtına Modu: Temelin sağlam, fırtına geçene kadar bekle!</div>
  <div id="canvas-container"></div>

  <div id="hud">
    <div class="info-group">
      <span class="streak-title">Mevcut Durum</span>
      <div class="streak-val">
        <span>🌱</span>
        <input type="number" id="streak-input" min="0" max="365" value="7" onchange="setStreakDirectly(this.value)">
        <span>Gün</span>
      </div>
      <span id="stage-text" class="stage-badge">1. Evre: Akut Dönem</span>
    </div>

    <div class="btn-group">
      <button onclick="changeStreak(-1)">-1</button>
      <button class="primary" onclick="changeStreak(1)">+1 Gün</button>
      <button onclick="setStreakDirectly(62)">62. Gün</button>
      <button class="danger" id="storm-btn" onclick="toggleStorm()">Fırtına</button>
    </div>
  </div>

  <script>
    // URL Parametreleri
    const urlParams = new URLSearchParams(window.location.search);
    let streak = parseInt(urlParams.get('streak')) || 7;
    let isStormy = urlParams.get('storm') === 'true';

    // Sahne, Kamera, Renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(22, 18, 26);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minDistance = 10;
    controls.maxDistance = 60;
    controls.target.set(0, 2, 0);

    // Işıklandırma
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1e293b, 0.6);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.4);
    sunLight.position.set(25, 35, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 100;
    const d = 20;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    // Şimşek Işığı
    const lightningLight = new THREE.PointLight(0xa5b4fc, 0, 150);
    lightningLight.position.set(0, 30, 0);
    scene.add(lightningLight);

    // Ana Ada Grubu
    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // Malzemeler
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x38a169, roughness: 0.8, flatShading: true });
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9, flatShading: true });
    const dirtMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.95, flatShading: true });
    const waterMat = new THREE.MeshStandardMaterial({
      color: 0x0ea5e9, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.75, flatShading: true
    });

    // Uçan Ada Tabanı
    function buildIslandBase() {
      const island = new THREE.Group();

      // Üst Çim Katman (Geniş 12 birim)
      const grassGeo = new THREE.CylinderGeometry(11.5, 10.8, 1.2, 24);
      const grassMesh = new THREE.Mesh(grassGeo, grassMat);
      grassMesh.position.y = 0.6;
      grassMesh.receiveShadow = true;
      grassMesh.castShadow = true;
      island.add(grassMesh);

      // Orta Toprak Katman
      const dirtGeo = new THREE.CylinderGeometry(10.8, 8.5, 2.5, 18);
      const dirtMesh = new THREE.Mesh(dirtGeo, dirtMat);
      dirtMesh.position.y = -1.25;
      dirtMesh.receiveShadow = true;
      dirtMesh.castShadow = true;
      island.add(dirtMesh);

      // Alt Kayalık Uçurum (Stalaktit Konisi)
      const rockGeo = new THREE.ConeGeometry(8.5, 9, 14);
      const rockMesh = new THREE.Mesh(rockGeo, rockMat);
      rockMesh.rotation.x = Math.PI;
      rockMesh.position.y = -7;
      rockMesh.receiveShadow = true;
      rockMesh.castShadow = true;
      island.add(rockMesh);

      // Küçük Uydu Adacıklar (Floating Rocks)
      const miniCoords = [
        { x: -14, y: -2, z: 6, s: 1.6 },
        { x: 13, y: 1, z: -8, s: 2.2 },
        { x: 11, y: -4, z: 12, s: 1.4 }
      ];
      miniCoords.forEach(c => {
        const miniRock = new THREE.Mesh(new THREE.DodecahedronGeometry(c.s, 1), rockMat);
        miniRock.position.set(c.x, c.y, c.z);
        miniRock.castShadow = true;
        island.add(miniRock);
      });

      // Şelale (Adadan süzülen su)
      const fallGeo = new THREE.PlaneGeometry(1.8, 8, 4, 8);
      const waterfall = new THREE.Mesh(fallGeo, waterMat);
      waterfall.position.set(0, -3.5, 11.2);
      waterfall.rotation.y = 0;
      island.add(waterfall);

      return island;
    }

    worldGroup.add(buildIslandBase());

    // Sonsuz Su Düzlemi (Aşağıdaki Okyanus)
    const oceanGeo = new THREE.PlaneGeometry(250, 250, 40, 40);
    oceanGeo.rotateX(-Math.PI / 2);
    const oceanMat = new THREE.MeshStandardMaterial({
      color: 0x0369a1, roughness: 0.2, metalness: 0.1, flatShading: true, transparent: true, opacity: 0.65
    });
    const ocean = new THREE.Mesh(oceanGeo, oceanMat);
    ocean.position.y = -18;
    ocean.receiveShadow = true;
    scene.add(ocean);

    // Ağaç Modelleri
    function createPineTree(scale = 1) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15 * scale, 0.22 * scale, 1.2 * scale, 5),
        new THREE.MeshStandardMaterial({ color: 0x451a03, flatShading: true })
      );
      trunk.position.y = 0.6 * scale;
      trunk.castShadow = true;
      g.add(trunk);

      const layers = 3;
      for (let i = 0; i < layers; i++) {
        const cone = new THREE.Mesh(
          new THREE.ConeGeometry((1.1 - i * 0.25) * scale, (1.4 - i * 0.2) * scale, 6),
          new THREE.MeshStandardMaterial({ color: 0x15803d, flatShading: true })
        );
        cone.position.y = (1.4 + i * 0.8) * scale;
        cone.castShadow = true;
        g.add(cone);
      }
      return g;
    }

    function createOakTree(scale = 1) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25 * scale, 0.35 * scale, 1.4 * scale, 6),
        new THREE.MeshStandardMaterial({ color: 0x5c2e0b, flatShading: true })
      );
      trunk.position.y = 0.7 * scale;
      trunk.castShadow = true;
      g.add(trunk);

      const foliage = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1.2 * scale, 1),
        new THREE.MeshStandardMaterial({ color: 0x22c55e, flatShading: true })
      );
      foliage.position.y = (1.9) * scale;
      foliage.castShadow = true;
      g.add(foliage);
      return g;
    }

    function createSakuraTree(scale = 1) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2 * scale, 0.3 * scale, 1.3 * scale, 5),
        new THREE.MeshStandardMaterial({ color: 0x3e2723, flatShading: true })
      );
      trunk.position.y = 0.65 * scale;
      trunk.castShadow = true;
      g.add(trunk);

      const foliage = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1.1 * scale, 1),
        new THREE.MeshStandardMaterial({ color: 0xf472b6, flatShading: true })
      );
      foliage.position.y = 1.8 * scale;
      foliage.castShadow = true;
      g.add(foliage);
      return g;
    }

    function createShrub(scale = 1) {
      const shrub = new THREE.Mesh(
        new THREE.DodecahedronGeometry(0.45 * scale, 0),
        new THREE.MeshStandardMaterial({ color: 0x4ade80, flatShading: true })
      );
      shrub.position.y = 0.3 * scale;
      shrub.castShadow = true;
      return shrub;
    }

    // Merkez Tapınak / Obelisk
    function createCenterMonument(currentStreak) {
      const g = new THREE.Group();
      if (currentStreak < 8) {
        // Taş Sunak / Kamp Ateşi
        const base = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.4, 0.4, 6), rockMat);
        base.position.y = 0.2;
        g.add(base);
      } else if (currentStreak < 22) {
        // Kristal Dikilitaş
        const base = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 2, 0.6, 6), rockMat);
        base.position.y = 0.3;
        g.add(base);
        const crystal = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.8, 0),
          new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, roughness: 0.1 })
        );
        crystal.position.y = 1.8;
        g.add(crystal);
      } else {
        // Kadim Tapınak + Çifte Halka (22+ Gün)
        const base = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.8, 0.8, 8), rockMat);
        base.position.y = 0.4;
        g.add(base);

        // 4 Sütun
        for (let i = 0; i < 4; i++) {
          const angle = (i / 4) * Math.PI * 2;
          const col = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 2.5, 6), rockMat);
          col.position.set(Math.cos(angle) * 1.6, 1.65, Math.sin(angle) * 1.6);
          col.castShadow = true;
          g.add(col);
        }

        // Büyük Yüzen Ruh Kristali
        const crystal = new THREE.Mesh(
          new THREE.OctahedronGeometry(1.2, 0),
          new THREE.MeshStandardMaterial({
            color: currentStreak >= 60 ? 0xfacc15 : 0x06b6d4,
            emissive: currentStreak >= 60 ? 0xd97706 : 0x0891b2,
            roughness: 0.1
          })
        );
        crystal.position.y = 2.8;
        g.add(crystal);
      }
      g.position.set(0, 1.2, 0);
      return g;
    }

    // Yağmur / Fırtına Parçacıkları
    let rainSystem = null;
    function setupRain() {
      const rainCount = 2500;
      const rainGeo = new THREE.BufferGeometry();
      const pos = new Float32Array(rainCount * 3);
      for (let i = 0; i < rainCount * 3; i += 3) {
        pos[i] = (Math.random() - 0.5) * 45;
        pos[i + 1] = Math.random() * 30;
        pos[i + 2] = (Math.random() - 0.5) * 45;
      }
      rainGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const rainMat = new THREE.PointsMaterial({
        color: 0x94a3b8, size: 0.14, transparent: true, opacity: 0.75
      });
      rainSystem = new THREE.Points(rainGeo, rainMat);
      scene.add(rainSystem);
    }

    // Yüzen Işık Parçacıkları (Fireflies / Ateş Böcekleri)
    let fireflies = null;
    function setupFireflies() {
      const count = 120;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        pos[i] = (Math.random() - 0.5) * 20;
        pos[i + 1] = 1.5 + Math.random() * 6;
        pos[i + 2] = (Math.random() - 0.5) * 20;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        color: 0x7dd3fc, size: 0.25, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending
      });
      fireflies = new THREE.Points(geo, mat);
      worldGroup.add(fireflies);
    }
    setupFireflies();

    let dynamicNature = [];

    // Dünyayı Güncelleme Motoru (Streak bazlı)
    function updateWorld() {
      // Önceki bitki/yapıları temizle
      dynamicNature.forEach(obj => worldGroup.remove(obj));
      dynamicNature = [];

      document.getElementById('streak-input').value = streak;

      // Evre İsimlendirmesi
      let stageName = "";
      if (streak <= 3) stageName = "1. Evre: Akut Direnç (Kül & Taş)";
      else if (streak <= 7) stageName = "2. Evre: Kırılma Eşiği (İlk Filizler)";
      else if (streak <= 21) stageName = "3. Evre: Denge & Zümrüt Vadi";
      else if (streak <= 60) stageName = "4. Evre: Zihinsel Netlik (Büyük Orman)";
      else stageName = "5. Evre: Kadim Bilgelik (Göksel Vaha)";
      document.getElementById('stage-text').innerText = stageName;

      // Renk & Işık Geçişleri
      if (!isStormy) {
        document.getElementById('storm-banner').style.display = 'none';
        if (streak < 4) {
          grassMat.color.setHex(0x52525b); // Kurak gri-yeşil
          scene.background = new THREE.Color(0x090d16);
          scene.fog = new THREE.FogExp2(0x090d16, 0.025);
          sunLight.intensity = 0.8;
          sunLight.color.setHex(0xffedd5);
        } else if (streak < 22) {
          grassMat.color.setHex(0x2f855a); // Canlı yeşil
          scene.background = new THREE.Color(0x0b1329);
          scene.fog = new THREE.FogExp2(0x0b1329, 0.018);
          sunLight.intensity = 1.3;
          sunLight.color.setHex(0xfffaed);
        } else {
          grassMat.color.setHex(0x15803d); // Zümrüt zengin orman
          scene.background = new THREE.Color(0x0f2338);
          scene.fog = new THREE.FogExp2(0x0f2338, 0.014);
          sunLight.intensity = 1.6;
          sunLight.color.setHex(0xfef08a);
        }
        if (rainSystem) rainSystem.visible = false;
        if (fireflies) fireflies.visible = true;
      } else {
        // Fırtına Hali
        document.getElementById('storm-banner').style.display = 'block';
        scene.background = new THREE.Color(0x020617);
        scene.fog = new THREE.FogExp2(0x020617, 0.045);
        sunLight.intensity = 0.15;
        if (!rainSystem) setupRain();
        rainSystem.visible = true;
        if (fireflies) fireflies.visible = false;
      }

      // Merkez Anıt
      const monument = createCenterMonument(streak);
      worldGroup.add(monument);
      dynamicNature.push(monument);

      // SINIRSIZ AĞAÇ VE BİTKİ OLUŞTURMA (Altın Oran Fibonacci Dağılımı)
      // Gün sayısı 62 ise tam 62 ağaç ve eşlik eden çalılar üretilir!
      const count = streak;
      const phi = 137.5 * (Math.PI / 180); // Altın Açı

      for (let i = 1; i <= count; i++) {
        // Yarıçapı merkez anıtı (2.5) boş bırakacak şekilde dışa doğru dağıt
        const r = 2.8 + Math.sqrt(i / Math.max(count, 30)) * 7.5;
        const theta = i * phi;
        const x = r * Math.cos(theta);
        const z = r * Math.sin(theta);

        // Ada sınırlarını aşma kontrolü (yarıçap ~10.8)
        if (Math.sqrt(x * x + z * z) > 10.5) continue;

        let tree;
        const scale = 0.75 + ((i * 17) % 5) * 0.12;

        if (i % 7 === 0 && streak >= 30) {
          tree = createSakuraTree(scale * 1.1); // Pembe Kiraz Ağaçları
        } else if (i % 2 === 0) {
          tree = createPineTree(scale);        // Çam Ağaçları
        } else {
          tree = createOakTree(scale);         // Meşe/Gür Ağaçlar
        }

        tree.position.set(x, 1.2, z);
        worldGroup.add(tree);
        dynamicNature.push(tree);

        // Her ağacın yanına küçük çalı/çiçek detayları
        if (i % 3 === 0) {
          const shrub = createShrub(0.6 + (i % 3) * 0.2);
          shrub.position.set(x + (Math.sin(i) * 0.8), 1.2, z + (Math.cos(i) * 0.8));
          worldGroup.add(shrub);
          dynamicNature.push(shrub);
        }
      }
    }

    // UI Fonksiyonları
    function changeStreak(delta) {
      streak = Math.max(0, streak + delta);
      updateWorld();
    }
    function setStreakDirectly(val) {
      streak = Math.max(0, parseInt(val) || 0);
      updateWorld();
    }
    function toggleStorm() {
      isStormy = !isStormy;
      const btn = document.getElementById('storm-btn');
      if (isStormy) {
        btn.innerText = "Fırtınayı Durdur";
        btn.style.background = "#dc2626";
      } else {
        btn.innerText = "Fırtına";
        btn.style.background = "";
      }
      updateWorld();
    }

    // Animasyon Döngüsü
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();
      controls.update();

      // Adanın hafif dinlendirici dönüşü
      worldGroup.rotation.y = elapsedTime * 0.04;

      // Okyanus Dalgası
      const pos = oceanGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const u = pos.getX(i);
        const v = pos.getY(i);
        pos.setZ(i, Math.sin(u * 0.15 + elapsedTime * 1.5) * 0.35 + Math.cos(v * 0.15 + elapsedTime * 1.2) * 0.35);
      }
      pos.needsUpdate = true;

      // Ateş Böceklerinin Salınımı
      if (fireflies && fireflies.visible) {
        const fPos = fireflies.geometry.attributes.position.array;
        for (let i = 1; i < fPos.length; i += 3) {
          fPos[i] += Math.sin(elapsedTime * 2 + i) * 0.008;
        }
        fireflies.geometry.attributes.position.needsUpdate = true;
      }

      // Fırtına ve Şimşek Hareketi
      if (isStormy) {
        if (rainSystem) {
          const rPos = rainSystem.geometry.attributes.position.array;
          for (let i = 1; i < rPos.length; i += 3) {
            rPos[i] -= 0.8;
            if (rPos[i] < -15) rPos[i] = 25;
          }
          rainSystem.geometry.attributes.position.needsUpdate = true;
        }

        // Rastgele Şimşek Çakması
        if (Math.random() < 0.015) {
          lightningLight.intensity = 3.5;
        } else {
          lightningLight.intensity *= 0.85;
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateWorld();
    animate();
  </script>
</body>
</html>
