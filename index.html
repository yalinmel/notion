<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zihin Adası - 3D Diorama</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0f1115; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui-overlay {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(18, 18, 24, 0.85); backdrop-filter: blur(10px);
      padding: 12px 24px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
      display: flex; gap: 15px; align-items: center; color: #fff; font-size: 14px;
    }
    button {
      background: #2563eb; color: white; border: none; padding: 6px 14px;
      border-radius: 15px; cursor: pointer; font-weight: 500; transition: 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.relapse-btn { background: #dc2626; }
    button.relapse-btn:hover { background: #b91c1c; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui-overlay">
    <span id="streak-text">🌱 Gün: 7</span>
    <button onclick="changeStreak(1)">+1 Gün</button>
    <button onclick="changeStreak(-1)">-1 Gün</button>
    <button class="relapse-btn" onclick="toggleStorm()">Fırtına Durumu</button>
  </div>

  <script>
    // URL parametrelerini oku (Örn: ?streak=7&storm=false)
    const urlParams = new URLSearchParams(window.location.search);
    let streak = parseInt(urlParams.get('streak')) || 7;
    let isStormy = urlParams.get('storm') === 'true';

    // Sahne, Kamera ve Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1117);
    scene.fog = new THREE.FogExp2(0x0e1117, 0.03);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 10, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2.1; // Kameranın yer altına inmesini engelle

    // Işıklar
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff3d1, 1.2);
    sunLight.position.set(15, 20, 10);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // Ada Tabanı (Low-poly Diorama)
    const islandGroup = new THREE.Group();
    scene.add(islandGroup);

    const islandGeo = new THREE.CylinderGeometry(5.5, 4, 2.5, 9);
    const islandMat = new THREE.MeshStandardMaterial({ color: 0x2d3748, flatShading: true, roughness: 0.9 });
    const islandMesh = new THREE.Mesh(islandGeo, islandMat);
    islandMesh.position.y = -1.25;
    islandMesh.receiveShadow = true;
    islandGroup.add(islandMesh);

    // Çimen Üst Katmanı
    const grassGeo = new THREE.CylinderGeometry(5.6, 5.5, 0.4, 9);
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x3b5323, flatShading: true, roughness: 0.8 });
    const grassMesh = new THREE.Mesh(grassGeo, grassMat);
    grassMesh.position.y = 0.1;
    grassMesh.receiveShadow = true;
    islandGroup.add(grassMesh);

    // Dinamik Öğeler Listesi
    let dynamicObjects = [];
    let rainSystem = null;

    // Ağaç Modeli Oluşturucu (Low-Poly)
    function createTree(x, z, scale = 1) {
      const tree = new THREE.Group();
      
      const trunkGeo = new THREE.CylinderGeometry(0.12 * scale, 0.18 * scale, 0.8 * scale, 5);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a2e18, flatShading: true });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = (0.4 * scale);
      trunk.castShadow = true;
      tree.add(trunk);

      const leavesGeo = new THREE.ConeGeometry(0.8 * scale, 1.6 * scale, 5);
      const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, flatShading: true });
      const leaves = new THREE.Mesh(leavesGeo, leavesMat);
      leaves.position.y = (1.4 * scale);
      leaves.castShadow = true;
      tree.add(leaves);

      tree.position.set(x, 0.3, z);
      return tree;
    }

    // Tapınak / Sunak Modeli
    function createAltar() {
      const altar = new THREE.Group();
      const baseGeo = new THREE.BoxGeometry(1.4, 0.3, 1.4);
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0x718096, flatShading: true });
      const base = new THREE.Mesh(baseGeo, stoneMat);
      base.castShadow = true;
      altar.add(base);

      // Kristal / Işık Çekirdeği
      const crystalGeo = new THREE.OctahedronGeometry(0.35);
      const crystalMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, roughness: 0.2 });
      const crystal = new THREE.Mesh(crystalGeo, crystalMat);
      crystal.position.y = 0.8;
      altar.add(crystal);

      altar.position.set(0, 0.3, 0);
      return altar;
    }

    // Yağmur / Fırtına Sistemi
    function setupRain() {
      const rainCount = 1200;
      const rainGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(rainCount * 3);

      for (let i = 0; i < rainCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 20;
        positions[i + 1] = Math.random() * 15;
        positions[i + 2] = (Math.random() - 0.5) * 20;
      }

      rainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const rainMat = new THREE.PointsMaterial({ color: 0x94a3b8, size: 0.08, transparent: true, opacity: 0.6 });
      rainSystem = new THREE.Points(rainGeo, rainMat);
      scene.add(rainSystem);
    }

    // Dünyayı Güncelleme Motoru
    function updateWorld() {
      // Önceki nesneleri temizle
      dynamicObjects.forEach(obj => islandGroup.remove(obj));
      dynamicObjects = [];

      document.getElementById('streak-text').innerText = `🌱 Gün: ${streak}`;

      // Renk tonlarını gün sayısına göre yumuşat
      if (!isStormy) {
        if (streak < 4) {
          grassMat.color.setHex(0x524e38); // Kurak zemin
          scene.background.setHex(0x13171f);
          scene.fog.color.setHex(0x13171f);
          sunLight.intensity = 0.6;
        } else if (streak < 8) {
          grassMat.color.setHex(0x386629); // Yeşillenen çimen
          scene.background.setHex(0x1a2436);
          scene.fog.color.setHex(0x1a2436);
          sunLight.intensity = 1.0;
        } else {
          grassMat.color.setHex(0x2d8a3e); // Zengin canlı yeşil
          scene.background.setHex(0x203a43);
          scene.fog.color.setHex(0x203a43);
          sunLight.intensity = 1.4;
        }
      }

      // Ağaçlandırma mantığı (Streak arttıkça adada yeni ağaçlar belirir)
      const treeCoordinates = [
        {x: 1.5, z: 1.5}, {x: -2, z: 1.2}, {x: 2.2, z: -1},
        {x: -1.8, z: -1.8}, {x: 0, z: 2.5}, {x: -2.8, z: -0.5},
        {x: 1, z: -2.8}, {x: -0.8, z: -2.6}, {x: 2.8, z: 1.2}
      ];

      const treeCount = Math.min(Math.floor(streak * 0.9), treeCoordinates.length);
      for (let i = 0; i < treeCount; i++) {
        const tree = createTree(treeCoordinates[i].x, treeCoordinates[i].z, 0.7 + (i % 3) * 0.2);
        islandGroup.add(tree);
        dynamicObjects.push(tree);
      }

      // Gün 7 ve sonrasında merkez sunak eklenir
      if (streak >= 7) {
        const altar = createAltar();
        islandGroup.add(altar);
        dynamicObjects.push(altar);
      }

      // Fırtına Durumu (Relapse Görselleştirmesi)
      if (isStormy) {
        scene.background.setHex(0x05070a);
        scene.fog.color.setHex(0x05070a);
        scene.fog.density = 0.06;
        sunLight.intensity = 0.2;
        ambientLight.intensity = 0.2;
        if (!rainSystem) setupRain();
        rainSystem.visible = true;
      } else {
        scene.fog.density = 0.025;
        ambientLight.intensity = 0.5;
        if (rainSystem) rainSystem.visible = false;
      }
    }

    // UI Fonksiyonları
    function changeStreak(delta) {
      streak = Math.max(0, streak + delta);
      updateWorld();
    }

    function toggleStorm() {
      isStormy = !isStormy;
      updateWorld();
    }

    // Render Döngüsü
    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      // Ada hafif salınım yapsın
      islandGroup.rotation.y += 0.0015;

      // Yağmur parçacık hareketi
      if (isStormy && rainSystem) {
        const positions = rainSystem.geometry.attributes.position.array;
        for (let i = 1; i < positions.length; i += 3) {
          positions[i] -= 0.3;
          if (positions[i] < 0) positions[i] = 15;
        }
        rainSystem.geometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateWorld();
    animate();
  </script>
</body>
</html>
