<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zihin Adası</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; background: #071c2b; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #canvas-container { position: fixed; inset: 0; }
    #canvas-container canvas { display: block; width: 100%; height: 100%; }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 39%, transparent 30%, rgba(2, 11, 19, .42) 100%); }
    .hud { position: fixed; z-index: 2; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); width: min(720px, calc(100vw - 28px)); transform: translateX(-50%); color: #f5fbf8; }
    .card { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 15px 17px; border: 1px solid rgba(255,255,255,.2); border-radius: 24px; background: rgba(7, 24, 35, .72); box-shadow: 0 18px 55px rgba(0,0,0,.3); backdrop-filter: blur(16px); }
    .seed { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(145deg, #285d45, #123e3b); box-shadow: inset 0 1px rgba(255,255,255,.2); font-size: 25px; }
    .eyebrow { margin: 0 0 2px; color: #9fdcc3; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .streak { margin: 0; font-size: clamp(18px, 3.4vw, 25px); font-weight: 800; letter-spacing: -.035em; }
    .message { margin: 3px 0 0; color: rgba(235,250,244,.72); font-size: 12px; }
    .progress { grid-column: 2 / 3; height: 5px; margin-top: -10px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.13); }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #82df8c, #e7db72); box-shadow: 0 0 12px #a5ed91; transition: width .45s ease; }
    .controls { display: flex; gap: 7px; }
    button { appearance: none; min-width: 40px; height: 40px; border: 0; border-radius: 13px; padding: 0 13px; color: white; background: rgba(255,255,255,.12); cursor: pointer; font: inherit; font-weight: 800; transition: transform .18s ease, background .18s ease; }
    button:hover { transform: translateY(-2px); background: rgba(255,255,255,.2); }
    button:active { transform: translateY(0) scale(.96); }
    #add { background: linear-gradient(135deg, #49b979, #218e75); box-shadow: 0 7px 20px rgba(37,160,109,.24); }
    #add:hover { background: linear-gradient(135deg, #58ca86, #2da787); }
    #weather { width: 40px; padding: 0; font-size: 17px; }
    .tip { position: fixed; top: max(17px, env(safe-area-inset-top)); left: 50%; z-index: 2; transform: translateX(-50%); padding: 9px 13px; border: 1px solid rgba(255,255,255,.13); border-radius: 999px; background: rgba(5,22,34,.5); color: rgba(239,255,247,.83); font-size: 12px; text-align: center; backdrop-filter: blur(8px); transition: opacity .3s; }
    @media (max-width: 570px) { .card { grid-template-columns: auto 1fr; gap: 10px; padding: 13px; border-radius: 21px; } .controls { grid-column: 1 / -1; justify-content: flex-end; } .progress { grid-column: 2; margin-top: -6px; } .message { display: none; } .tip { max-width: calc(100vw - 32px); } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <main id="canvas-container" aria-label="Gün sayısına göre büyüyen Zihin Adası"></main>
  <div class="vignette"></div>
  <div class="tip" id="tip">Adanı döndürmek için sürükle · Yakınlaşmak için kaydır</div>
  <section class="hud" aria-live="polite">
    <div class="card">
      <div class="seed" id="seed">🌱</div>
      <div>
        <p class="eyebrow" id="level">İlk filizler</p>
        <p class="streak" id="streak-text">7 gün</p>
        <p class="message" id="message">Köklerin güçleniyor.</p>
      </div>
      <div class="controls">
        <button id="minus" title="Bir günü geri al" aria-label="Bir günü geri al">−</button>
        <button id="add" title="Bugünü tamamla" aria-label="Bugünü tamamla">+1</button>
        <button id="weather" title="Zor gün modu" aria-label="Zor gün modunu aç veya kapat">☀️</button>
      </div>
      <div class="progress" aria-hidden="true"><span id="progress-fill"></span></div>
    </div>
  </section>

  <script>
    // URL ile kontrol: ?streak=14&storm=true. Parametre yoksa son değer tarayıcıda korunur.
    const query = new URLSearchParams(location.search);
    const saved = Number(localStorage.getItem('zihin-adasi-streak'));
    let streak = Math.max(0, Math.floor(query.has('streak') ? Number(query.get('streak')) : (Number.isFinite(saved) ? saved : 7)));
    let isStormy = query.get('storm') === 'true';
    const $ = id => document.getElementById(id);
    const container = $('canvas-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a2939);
    scene.fog = new THREE.FogExp2(0x0a2939, .024);
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 100);
    camera.position.set(11, 9, 13);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = .055;
    controls.enablePan = false; controls.minDistance = 10; controls.maxDistance = 21;
    controls.maxPolarAngle = Math.PI / 2.12; controls.target.set(0, .45, 0);

    const hemi = new THREE.HemisphereLight(0xc6f3ff, 0x17321e, 1.18); scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffedb0, 1.65); sun.position.set(7, 13, 5); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024); sun.shadow.camera.left = -10; sun.shadow.camera.right = 10; sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10; scene.add(sun);
    const moon = new THREE.DirectionalLight(0x7ab4ff, .22); moon.position.set(-8, 7, -9); scene.add(moon);

    const world = new THREE.Group(); scene.add(world);
    const grass = new THREE.MeshStandardMaterial({ color: 0x4d9b53, flatShading: true, roughness: .92 });
    const earth = new THREE.MeshStandardMaterial({ color: 0x795035, flatShading: true, roughness: 1 });
    const rock = new THREE.MeshStandardMaterial({ color: 0x3a5970, flatShading: true, roughness: .92 });
    function mesh(geometry, material, y = 0) { const item = new THREE.Mesh(geometry, material); item.position.y = y; item.castShadow = item.receiveShadow = true; return item; }
    const water = mesh(new THREE.CylinderGeometry(9.4, 9.4, .18, 48), new THREE.MeshStandardMaterial({ color: 0x176a87, roughness: .42, metalness: .08, transparent: true, opacity: .92 }), -1.72); water.receiveShadow = false; scene.add(water);
    const shore = mesh(new THREE.CylinderGeometry(5.9, 5.18, .3, 12), new THREE.MeshStandardMaterial({ color: 0xd8c06e, flatShading: true, roughness: 1 }), -.86); world.add(shore);
    const soil = mesh(new THREE.CylinderGeometry(5.56, 4.85, 1.45, 12), earth, -1.4); world.add(soil);
    const lawn = mesh(new THREE.CylinderGeometry(5.58, 5.48, .32, 12), grass, -.53); world.add(lawn);
    // Küçük taşlar adanın sınırını daha doğal gösterir.
    for (let i = 0; i < 15; i++) { const a = i / 15 * Math.PI * 2; const r = 5.0 + (i % 3) * .22; const stone = mesh(new THREE.DodecahedronGeometry(.19 + (i % 2) * .08, 0), rock, -.28); stone.position.set(Math.cos(a) * r, -.28, Math.sin(a) * r); stone.rotation.set(i, a, i * .6); world.add(stone); }

    const dynamic = new THREE.Group(); world.add(dynamic);
    const swaying = []; let rain = null; let glow = null;
    const positions = [ [-2.6,1.9], [2.5,1.75], [-3.25,-.3], [2.9,-.9], [-1.25,3.6], [1.1,3.55], [-2.1,-2.65], [1.55,-2.75], [3.75,.35], [-4.05,1.22], [.1,-3.85], [3.15,2.75], [-3.55,-2.1], [-.5,2.35], [2.15,-3.45], [-4.1,.2], [3.9,-1.85], [-1.4,-3.7], [4.15,1.3], [.7,4.15], [-2.7,3.05], [2.55,-2.15] ];
    const treeMats = [0x246f42, 0x348650, 0x1f6041, 0x4c984e].map(c => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: .9 }));
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6a4429, flatShading: true, roughness: 1 });
    function makeTree(x, z, size, index) {
      const tree = new THREE.Group();
      const trunk = mesh(new THREE.CylinderGeometry(.08 * size, .15 * size, .92 * size, 6), trunkMat, .46 * size); tree.add(trunk);
      const leaves = treeMats[index % treeMats.length];
      // Katmanlar, ağaç büyüdükçe daha geniş bir taç hissi verir.
      [[.56, .78, 1.08], [.76, 1.02, 1.52], [.49, 1.34, 1.92]].forEach(([radius, height, y]) => {
        const crown = mesh(new THREE.ConeGeometry(radius * size, height * size, 7), leaves, y * size); tree.add(crown);
      });
      tree.position.set(x, -.32, z); tree.rotation.y = (index * 1.71) % Math.PI;
      dynamic.add(tree); swaying.push({ tree, phase: index * 1.93, base: tree.rotation.z });
    }
    function makeFlower(x, z, hue) {
      const flower = new THREE.Group(); const stem = mesh(new THREE.CylinderGeometry(.018,.025,.28,5), new THREE.MeshStandardMaterial({ color: 0x347641, flatShading:true }), -.11); flower.add(stem);
      const petalMat = new THREE.MeshStandardMaterial({ color:hue, emissive:hue, emissiveIntensity:.12, flatShading:true });
      for(let p=0;p<5;p++) { const petal = mesh(new THREE.SphereGeometry(.075,5,4),petalMat,.035); petal.position.set(Math.cos(p*1.256)*.09,.035,Math.sin(p*1.256)*.09); flower.add(petal); }
      flower.position.set(x,-.25,z); dynamic.add(flower);
    }
    function makeAltar() {
      const altar = new THREE.Group(); const baseMat = new THREE.MeshStandardMaterial({color:0x7390a0,flatShading:true,roughness:.8});
      const base = mesh(new THREE.CylinderGeometry(.7,.88,.25,6),baseMat,-.12); altar.add(base);
      const crystalMat = new THREE.MeshStandardMaterial({color:0x70f5df,emissive:0x21b8ae,emissiveIntensity:1.3,roughness:.15,metalness:.15});
      const crystal = mesh(new THREE.OctahedronGeometry(.31,0),crystalMat,.34); altar.add(crystal);
      const light = new THREE.PointLight(0x59ffe4,1.4,5); light.position.y=.4; altar.add(light); altar.position.y=-.22; dynamic.add(altar); glow={altar,crystal};
    }
    function makeRain() {
      const count = 850, geo = new THREE.BufferGeometry(), data = new Float32Array(count*3);
      for(let i=0;i<data.length;i+=3){ data[i]=(Math.random()-.5)*18; data[i+1]=Math.random()*13; data[i+2]=(Math.random()-.5)*18; }
      geo.setAttribute('position',new THREE.BufferAttribute(data,3)); rain=new THREE.Points(geo,new THREE.PointsMaterial({color:0x9bd9ff,size:.045,transparent:true,opacity:.75})); scene.add(rain);
    }
    function disposeChildren(group) { while(group.children.length) { const child = group.children.pop(); group.remove(child); } }
    function getStage(days) {
      if (days < 3) return ['İlk filizler', 'Bugün küçük bir alanı koruyorsun.', '🌱'];
      if (days < 7) return ['Kök salma', 'Toprağın yeniden güç topluyor.', '🌿'];
      if (days < 14) return ['Yeşeren patika', 'Her gün yeni bir yaşam alanı açılıyor.', '🌳'];
      if (days < 30) return ['Küçük koru', 'Sabrın adanı bir ormana çeviriyor.', '🌲'];
      if (days < 60) return ['Canlı orman', 'Bu düzen artık güçlü bir sığınak.', '✨'];
      return ['Kadim orman', 'Attığın her adım burada iz bırakıyor.', '🏝️'];
    }
    function updateWorld() {
      disposeChildren(dynamic); swaying.length=0; glow=null;
      // 1. günde bir fidan; her üç günde bir yeni ağaç. Mevcut ağaçlar da 60. güne kadar büyür.
      const count = Math.min(positions.length, Math.max(1, 1 + Math.floor(streak / 3)));
      const maturity = Math.min(streak / 60, 1);
      for (let i=0;i<count;i++) { const [x,z]=positions[i]; const ageBoost = Math.min(1, Math.max(0, (streak - i*3) / 18)); makeTree(x,z,.43 + maturity*.48 + ageBoost*.27 + (i%3)*.035,i); }
      const flowerCount = Math.min(18, Math.floor(streak / 2));
      for(let i=0;i<flowerCount;i++) { const a=(i*2.399)+.45, r=1.25+(i%5)*.57; makeFlower(Math.cos(a)*r,Math.sin(a)*r,i%3===0?0xffb2cf:i%3===1?0xffdb72:0xbca8ff); }
      if (streak >= 7) makeAltar();
      const lush = Math.min(streak / 30, 1);
      grass.color.setHSL(.30 + lush*.055, .38 + lush*.2, .28 + lush*.12);
      if (isStormy) {
        scene.background.setHex(0x0a172b); scene.fog.color.setHex(0x0a172b); scene.fog.density=.052; sun.intensity=.32; hemi.intensity=.54; moon.intensity=.55; if(!rain) makeRain(); rain.visible=true;
        $('weather').textContent='🌧️'; $('weather').title='Zor gün modunu kapat'; $('tip').textContent='Zor günler de yolun bir parçası. Ada yerinde, sen de öyle.';
      } else {
        scene.background.setHSL(.55, .54, .15 + lush*.07); scene.fog.color.copy(scene.background); scene.fog.density=.024; sun.intensity=1.45; hemi.intensity=1.18; moon.intensity=.22; if(rain) rain.visible=false;
        $('weather').textContent='☀️'; $('weather').title='Zor gün modunu aç'; $('tip').textContent='Adanı döndürmek için sürükle · Yakınlaşmak için kaydır';
      }
      const [label, line, emoji] = getStage(streak); $('level').textContent=label; $('streak-text').textContent=`${streak} ${streak === 1 ? 'gün' : 'gün'}`; $('message').textContent=line; $('seed').textContent=emoji;
      $('progress-fill').style.width=`${((streak % 7) / 7) * 100}%`;
      localStorage.setItem('zihin-adasi-streak', String(streak));
    }
    $('add').addEventListener('click',()=>{ streak++; updateWorld(); });
    $('minus').addEventListener('click',()=>{ streak=Math.max(0,streak-1); updateWorld(); });
    $('weather').addEventListener('click',()=>{ isStormy=!isStormy; updateWorld(); });
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    let clock = new THREE.Clock();
    function animate() { requestAnimationFrame(animate); const t=clock.getElapsedTime(); controls.update(); water.rotation.y+=.00045; water.position.y=-1.72+Math.sin(t*.75)*.025;
      swaying.forEach(({tree,phase,base})=>{ tree.rotation.z=base+Math.sin(t*1.2+phase)*.018; });
      if(glow) { glow.altar.rotation.y=t*.45; glow.crystal.position.y=.34+Math.sin(t*2.2)*.055; }
      if(isStormy && rain) { const a=rain.geometry.attributes.position.array; for(let i=1;i<a.length;i+=3){a[i]-=.22;if(a[i]<-2)a[i]=12;} rain.geometry.attributes.position.needsUpdate=true; }
      renderer.render(scene,camera); }
    updateWorld(); animate();
  </script>
</body>
</html>
